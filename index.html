<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SelfDu.cu - AI 자기소개서 생성기</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6e45ff;
            --secondary-color: #f0f0f0;
            --text-color: #333;
            --bg-color: #ffffff;
            --noise-bg: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect fill="%23f9f9f9" width="100" height="100"/><g fill-opacity="0.05"><rect fill="%236e45ff" x="50" width="50" height="50"/><rect fill="%23f0f0f0" y="50" width="50" height="50"/></g></svg>');
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            background-image: var(--noise-bg);
            color: var(--text-color);
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 4px rgba(110, 69, 255, 0.2);
        }

        p.subtitle {
            font-size: 1.25rem;
            font-weight: 300;
            margin-bottom: 2rem;
            color: #555;
            line-height: 1.6;
        }

        .cta-button {
            background: linear-gradient(45deg, var(--primary-color), #8a6dff);
            color: white;
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(110, 69, 255, 0.4);
            display: inline-block;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(110, 69, 255, 0.6);
        }
        
        .cta-button:active {
            transform: translateY(0);
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>SelfDu.cu</h1>
        <p class="subtitle">AI 기반 자기소개서 생성 서비스, SelfDu.cu로<br>당신의 강점을 발견하고 최고의 자기소개서를 완성하세요.</p>
        <a href="/app.html" class="cta-button">시작하기</a>
    </div>
</body>
</html>
